# /etc/nginx/sites-available/bhav  (then: ln -s into sites-enabled, certbot --nginx -d your-domain.example)
limit_req_zone $binary_remote_addr zone=bhav_auth:10m rate=10r/m;

server {
    listen 80;
    server_name your-domain.example;

    location /static/ {
        alias /opt/bhav/bhav/static/;
        expires 7d;
    }

    # Slow down password guessing and signup spam.
    location ~ ^/(login|signup)$ {
        limit_req zone=bhav_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
